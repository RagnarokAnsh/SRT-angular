<div class="wheel" #wheel>
  <!-- Domains and competencies are buttons and links of their own; clicks are handled here. -->
  <svg
    class="wheel__svg"
    [attr.viewBox]="'0 0 ' + size + ' ' + size"
    role="group"
    [attr.aria-label]="summary()"
    [class.is-linked]="linked()"
    [class.has-selection]="expanded() !== null"
    [class.morphs]="morphs"
    [class.is-opening]="opening()"
    (pointerdown)="onPointerDown($event)"
    (pointerover)="onPointerOver($event)"
    (pointerleave)="onPointerLeave($event)"
    (click)="onClick($event)"
    (keydown.escape)="onEscape()"
  >
    @if (zoom(); as z) {
      <!-- Phones: one domain, its competencies all around it. -->
      @for (competency of z.competencies; track competency.slug) {
        <g
          class="competency"
          [attr.data-competency]="competency.slug"
          [attr.role]="linked() ? 'link' : null"
          [attr.tabindex]="linked() ? 0 : null"
          [attr.aria-label]="linked() ? competency.name : null"
          (keydown)="onCompetencyKey($event, competency.slug)"
        >
          <path
            class="segment segment--competency"
            [attr.d]="competency.path"
            [attr.fill]="z.tint"
          />
          <text
            class="label label--competency"
            [attr.font-size]="z.competencyFont"
            text-anchor="middle"
            [attr.aria-hidden]="linked() ? 'true' : null"
          >
            @for (line of competency.label.lines; track $index) {
              <tspan [attr.x]="competency.label.x" [attr.y]="line.y">{{ line.text }}</tspan>
            }
          </text>
        </g>
      }
      <g
        class="zoom-disc"
        data-back
        role="button"
        tabindex="0"
        aria-expanded="true"
        [attr.aria-label]="z.name"
        (keydown)="onBackKey($event)"
      >
        <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="zoomDisc" [attr.fill]="z.color" />
        <path class="close-mark" [attr.d]="closeMark" />
        <text
          class="label label--domain"
          [attr.font-size]="z.font"
          text-anchor="middle"
          aria-hidden="true"
        >
          @for (line of z.label.lines; track $index) {
            <tspan [attr.x]="z.label.x" [attr.y]="line.y">{{ line.text }}</tspan>
          }
        </text>
      </g>
    } @else {
      <!-- Invisible: while competencies show, the pointer outside them still points at a domain. -->
      @for (domain of model().domains; track domain.slug) {
        @if (domain.track; as track) {
          <path class="track" [attr.d]="track" [attr.data-domain]="domain.index" />
        }
      }

      @for (domain of model().domains; track domain.slug) {
        <g
          class="domain"
          role="button"
          tabindex="0"
          [attr.data-domain]="domain.index"
          [attr.aria-label]="domain.name"
          [attr.aria-expanded]="expanded() === domain.index"
          [class.is-selected]="expanded() === domain.index"
          [class.is-dimmed]="expanded() !== null && expanded() !== domain.index"
          (focus)="onDomainFocus($event, domain.index)"
          (keydown)="onDomainKey($event, domain.index)"
        >
          <path
            class="segment segment--domain"
            [attr.d]="isOpen() && domain.open ? domain.open.path : domain.path"
            [attr.fill]="domain.color"
          />
          <text
            class="label label--domain"
            [attr.font-size]="model().domainFont"
            text-anchor="middle"
            aria-hidden="true"
            [style.transform]="
              domain.open ? (isOpen() ? domain.open.labelTo : domain.open.labelFrom) : null
            "
          >
            @for (line of domain.label.lines; track $index) {
              <tspan [attr.x]="domain.label.x" [attr.y]="line.y">{{ line.text }}</tspan>
            }
          </text>
        </g>

        @if (fan(); as f) {
          @if (f.index === domain.index) {
            @for (competency of f.competencies; track competency.slug) {
              <g
                class="competency competency--fan"
                [attr.data-competency]="competency.slug"
                [attr.role]="linked() ? 'link' : null"
                [attr.tabindex]="linked() ? 0 : null"
                [attr.aria-label]="linked() ? competency.name : null"
                (keydown)="onCompetencyKey($event, competency.slug)"
              >
                <path
                  class="segment segment--competency"
                  [attr.d]="competency.path"
                  [attr.fill]="f.tint"
                />
                <text
                  class="label label--competency"
                  [attr.font-size]="f.competencyFont"
                  text-anchor="middle"
                  [attr.aria-hidden]="linked() ? 'true' : null"
                >
                  @for (line of competency.label.lines; track $index) {
                    <tspan [attr.x]="competency.label.x" [attr.y]="line.y">{{ line.text }}</tspan>
                  }
                </text>
              </g>
            }
          }
        }
      }

      <circle class="hub" [attr.cx]="center" [attr.cy]="center" [attr.r]="spec().hub" />
      <text class="label label--hub" [attr.font-size]="model().hubFont" text-anchor="middle">
        @for (line of model().hub; track $index) {
          <tspan [attr.x]="center" [attr.y]="line.y">{{ line.text }}</tspan>
        }
      </text>
    }
  </svg>

  @if (hint(); as hint) {
    <p class="wheel__hint">
      <mat-icon [svgIcon]="hint.icon" aria-hidden="true" />
      {{ hint.key | transloco }}
    </p>
  }
</div>
