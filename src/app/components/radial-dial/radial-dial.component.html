<div class="radial-dial-svg-container">
  <svg
    [attr.width]="center * 2"
    [attr.height]="center * 2"
    [attr.viewBox]="'0 0 ' + center * 2 + ' ' + center * 2"
  >
    <!-- Center Circle -->
    <circle
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="ringWidth - 6"
      fill="#34495e"
    />
    <text
      [attr.x]="center"
      [attr.y]="center"
      text-anchor="middle"
      alignment-baseline="middle"
      font-size="30"
      fill="#fff"
      font-weight="bold"
      style="pointer-events: none"
    >
      <tspan [attr.x]="center" dy="-0.3em">School</tspan>
      <tspan [attr.x]="center" dy="1em">Readiness</tspan>
    </text>

    <!-- Domain Arc Paths for Text -->
    <defs>
      @for (sector of getDomainSectors(); track sector; let i = $index) {
        <path
          [attr.id]="'domain-arc-' + i"
          [attr.d]="getArcTextPath(sector, 'domain-arc-' + i)"
          fill="none"
        />
      }
      @if (expandedLevel === "competency" && hoveredDomainIdx !== null) {
        <ng-container>
          @for (
            sector of getCompetencySectors(hoveredDomainIdx);
            track sector;
            let k = $index
          ) {
            <path
              [attr.id]="'competency-arc-' + k"
              [attr.d]="getArcTextPath(sector, 'competency-arc-' + k)"
              fill="none"
            />
          }
        </ng-container>
      }
    </defs>

    <!-- Domains -->
    <g>
      @for (sector of getDomainSectors(); track sector; let i = $index) {
        <g>
          <path
            [attr.d]="getArcPath(sector)"
            [attr.fill]="sector.color"
            [attr.stroke]="'#fff'"
            stroke-width="2.5"
            class="dial-sector domain-sector"
            [class.active]="hoveredDomainIdx === i"
            (mouseenter)="onDomainHover(i)"
            (mouseleave)="onDomainLeave()"
            (click)="onDomainClick(i)"
            (touchstart)="onDomainClick(i)"
            style="cursor: pointer"
          />
          <text
            [attr.font-size]="getResponsiveFontSize(sector)"
            fill="#fff"
            font-weight="200"
            style="pointer-events: none"
          >
            <textPath
              [attr.xlink:href]="'#domain-arc-' + i"
              startOffset="50%"
              text-anchor="middle"
            >
              <title>{{ sector.label }}</title>
              @for (
                line of splitLabelToLines(
                  getTruncatedDomainLabel(sector),
                  getMaxCharsPerLine(sector)
                );
                track line;
                let isFirst = $first
              ) {
                <ng-container>
                  <tspan x="0" [attr.dy]="isFirst ? '0' : '1.2em'">
                    {{ line }}
                  </tspan>
                </ng-container>
              }
            </textPath>
          </text>
        </g>
      }
    </g>

    <!-- Competencies -->
    @if (expandedLevel === "competency" && hoveredDomainIdx !== null) {
      <g>
        @for (
          sector of getCompetencySectors(hoveredDomainIdx);
          track sector;
          let k = $index
        ) {
          <g>
            <path
              [attr.d]="getArcPath(sector)"
              [attr.fill]="sector.color"
              [attr.stroke]="'#fff'"
              stroke-width="2"
              class="dial-sector competency-sector"
              style="cursor: pointer"
            />
            <!-- Render vertical text for competencies, centered in the thick ring -->
            <g
              [attr.transform]="
                'translate(' +
                getTextPosition(sector).x +
                ',' +
                getTextPosition(sector).y +
                ') rotate(' +
                getTextPosition(sector).rotation +
                ')'
              "
            >
              <text
                [attr.font-size]="getCompetencyFontSize(sector)"
                fill="#fff"
                font-weight="200"
                style="pointer-events: none; writing-mode: tb"
                [attr.text-anchor]="'middle'"
                [attr.alignment-baseline]="'middle'"
                [attr.dominant-baseline]="'middle'"
              >
                {{ sector.label }}
              </text>
            </g>
          </g>
        }
      </g>
    }
  </svg>
</div>

<script>
  function min(a, b) {
    return Math.min(a, b);
  }
</script>
