<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>School Ready Children</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Content Security Policy: only this site's own scripts, styles, fonts and media, and API
      calls to the backend. If the API address changes (src/environments/environment.prod.ts),
      update connect-src too. Inline styles are needed by Angular's component styles.
      frame-ancestors can only be set as an HTTP header (see docs/DEPLOYMENT.md).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' http://ready.unilearn.org.in https://ready.unilearn.org.in; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Observe, record and follow the school readiness of children at Anganwadi centres."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      This app needs JavaScript. Please turn it on in your browser settings.
      / इस ऐप के लिए JavaScript ज़रूरी है। कृपया इसे ब्राउज़र की सेटिंग में चालू करें।
    </noscript>
  </body>
</html>
